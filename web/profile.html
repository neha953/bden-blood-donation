<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - BDEN</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head><body><nav id="nav"></nav><div class="wrap"><div class="card" style="max-width:600px;margin:auto"><h2 class="t">My profile</h2><form id="f">
<label>Full name</label><input name="full_name" id="n" required>
<label>Email</label><input id="e" disabled>
<div class="row"><div><label>Phone</label><input name="phone" id="p"></div><div><label>City</label><input name="city" id="c"></div></div>
<div id="dn" class="hide"><div class="row"><div><label>Blood group</label><input id="b" disabled></div><div><label>Weight (kg)</label><input name="weight_kg" id="w" type="number" step="0.1" min="50"></div></div>
<label>Availability</label><select name="is_available" id="a"><option value="1">Available to donate</option><option value="0">Not available right now</option></select>
<p style="margin-top:10px"><span class="badge" id="vb"></span></p></div>
<br><button class="btn" style="width:100%">Save changes</button></form></div></div>
<script src="app.js"></script><script>
boot('USER').then(async u=>{if(!u)return;const d=await api('profile');
n.value=d.user.full_name;e.value=d.user.email;p.value=d.user.phone||'';c.value=d.user.city||'';
if(d.donor){dn.classList.remove('hide');b.value=d.donor.blood_group;w.value=d.donor.weight_kg;a.value=d.donor.is_available;vb.textContent=d.donor.verified?'Verified donor':'Verification pending';vb.className='badge '+(d.donor.verified?'yes':'PENDING')}});
f.onsubmit=async ev=>{ev.preventDefault();try{await api('profile',Object.fromEntries(new FormData(f)));toast('Profile updated')}catch(x){toast(x.message,false)}};
</script></body></html>
