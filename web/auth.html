<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - BDEN</title><link rel="stylesheet" href="style.css"></head><body>
<nav id="nav"></nav>
<div class="auth card">
<div class="tabs"><button id="tl" class="on" onclick="tab(0)">Login</button><button id="tr" onclick="tab(1)">Register</button></div>
<form id="fl"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><br><br><button class="btn" style="width:100%">Login</button></form>
<form id="fr" class="hide">
<div class="row"><div><label>I am a</label><select name="role" id="role" onchange="rl()"><option value="DONOR">Donor</option><option value="PATIENT">Patient / Attendant</option></select></div>
<div><label>Full name</label><input name="full_name" required></div></div>
<div class="row"><div><label>Email</label><input name="email" type="email" required></div><div><label>Password (6+)</label><input name="password" type="password" minlength="6" required></div></div>
<div class="row"><div><label>Phone</label><input name="phone"></div><div><label>City</label><input name="city" required></div></div>
<div id="dn"><div class="row"><div><label>Blood group</label><select name="blood_group"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div><label>Gender</label><select name="gender"><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></div></div>
<div class="row"><div><label>Date of birth</label><input name="date_of_birth" type="date"></div><div><label>Weight (kg, min 50)</label><input name="weight_kg" type="number" step="0.1" value="60"></div></div></div>
<br><button class="btn" style="width:100%">Create account</button></form></div>
<script src="app.js"></script><script>
boot().then(()=>{});
function tab(i){fl.classList.toggle('hide',!!i);fr.classList.toggle('hide',!i);tl.classList.toggle('on',!i);tr.classList.toggle('on',!!i)}
function rl(){dn.classList.toggle('hide',role.value!=='DONOR')}
fl.onsubmit=async e=>{e.preventDefault();try{const r=await api('login',Object.fromEntries(new FormData(fl)));location.href=r.user.role==='ADMIN'?'admin.html':'dashboard.html'}catch(x){toast(x.message,false)}};
fr.onsubmit=async e=>{e.preventDefault();try{const r=await api('register',Object.fromEntries(new FormData(fr)));toast(r.message);fr.reset();tab(0)}catch(x){toast(x.message,false)}};
</script></body></html>
